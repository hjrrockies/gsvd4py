[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gsvd4py"
description = "Generalized SVD (GSVD) via LAPACK ?ggsvd3"
# Single source of truth: gsvd4py.__version__
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Hayden Ringer", email = "hjrrockies@gmail.com"}]
dependencies = [
    # Floors are the oldest versions CI actually exercises (see the
    # "oldest supported versions" job); no code here needs anything newer.
    # SciPy is used only to locate a LAPACK library, not for its API.
    "scipy >= 1.7.3",
    "numpy >= 1.19.5",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/hjrrockies/gsvd4py"
"Source Code" = "https://github.com/hjrrockies/gsvd4py"
"Issue Tracker" = "https://github.com/hjrrockies/gsvd4py/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "gsvd4py.__version__"}
