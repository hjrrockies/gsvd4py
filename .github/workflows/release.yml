name: release

# Publishing is triggered by publishing a GitHub Release, so the release page
# is the human checkpoint. Draft it, check it, then hit Publish.
on:
  release:
    types: [published]
  # Manual, non-destructive check that the PyPI trusted publisher is
  # registered correctly. Mints a credential and discards it; uploads nothing.
  workflow_dispatch:

jobs:
  # Do not publish anything that does not pass its own test suite: a release
  # can be cut from any commit, including one whose CI never went green.
  test:
    name: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
      - run: python -m pytest tests/ -v

  build:
    name: build distributions
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # The version lives in gsvd4py.__version__; the tag is typed by hand.
      # Catch the mismatch here rather than burning a PyPI version number on it.
      - name: Check tag matches package version
        run: |
          python -m pip install --no-deps .
          pkg=$(python -c "import gsvd4py; print(gsvd4py.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "package: $pkg / tag: $tag"
          test "$pkg" = "$tag" || {
            echo "::error::tag $GITHUB_REF_NAME does not match gsvd4py.__version__ ($pkg)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    # Register this on PyPI as the trusted publisher's environment. If you
    # leave the environment field blank there, delete these two lines.
    environment:
      name: pypi
      url: https://pypi.org/project/gsvd4py/

    # OIDC: GitHub mints a short-lived identity token that PyPI verifies
    # against the registered publisher. No API token is stored anywhere.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Proves the OIDC claims (repo, workflow file, environment) match what is
  # registered on PyPI, without consuming a version number. Must live in this
  # file: the workflow filename is part of the claim being verified.
  check-publisher:
    name: check trusted publisher
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gsvd4py/
    permissions:
      id-token: write
    steps:
      - name: Exchange an OIDC token with PyPI
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r '.value')
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$oidc\"}")
          # The response body holds a real (short-lived) upload credential.
          # Report only whether one came back -- never print it.
          if [ "$code" = "200" ] && jq -e 'has("token")' /tmp/resp.json >/dev/null; then
            echo "Trusted publisher is registered correctly: PyPI issued a credential."
          else
            echo "::error::PyPI refused to mint a token (HTTP $code)."
            jq -r '.message // "no message"' /tmp/resp.json 2>/dev/null || true
            jq -r '.errors[]?.description // empty' /tmp/resp.json 2>/dev/null || true
            exit 1
          fi
          rm -f /tmp/resp.json
